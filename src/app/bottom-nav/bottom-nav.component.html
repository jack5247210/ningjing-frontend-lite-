<nav class="bottom-nav">
  <div class="nav-items">
    <a *ngFor="let item of navItems" 
       [routerLink]="item.route" 
       class="nav-item"
       [class.active]="router.isActive(item.route, {paths: 'subset', queryParams: 'ignored', fragment: 'ignored', matrixParams: 'ignored'})">
      <span class="nav-icon">{{ item.icon }}</span>
      <span class="nav-label">{{ item.label }}</span>
    </a>
  </div>
</nav>
